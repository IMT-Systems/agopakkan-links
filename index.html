  main{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---- avatar ---- */
  .avatar{
    position:relative;
    width:112px;
    height:112px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(155deg,var(--gold-bright),var(--gold-mid) 55%,var(--gold-deep));
    padding:4px;
  }
  .avatar img{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }

  .badge{
    position:absolute;
    right:-6px;
    bottom:-4px;
    z-index:2;
    width:34px;
    height:34px;
    border-radius:50%;
    background:linear-gradient(155deg,var(--gold-bright),var(--gold-mid));
    display:flex;
    align-items:center;
    justify-content:center;
    transform:rotate(-12deg);
    border:2px solid var(--yellow);
  }
  .badge svg{ width:16px; height:16px; color:var(--ink); }

  .title-wrap{
    position:relative;
    margin:26px 0 10px;
    display:inline-flex;
  }
  h1{
    margin:0;
    font-family:'Yusei Magic', sans-serif;
    font-size:2.6rem;
    color:var(--ink);
    letter-spacing:normal;
    text-align:center;
    text-wrap:balance;
    text-shadow:1.5px 1.5px 0 var(--ink), -1px -1px 0 rgba(255,255,255,.5);
  }
  .stamp{
    position:absolute;
    top:-22px;
    right:-34px;
    width:64px;
    height:64px;
    border-radius:50%;
    object-fit:cover;
    transform:rotate(-12deg);
    border:2px solid #fff;
    box-shadow:0 6px 14px -6px rgba(20,12,2,0.55);
  }

  .tagline{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 34px;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.36em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .tagline::before, .tagline::after{
    content:"";
    width:22px;
    height:1px;
    background:var(--ink-dim);
    opacity:.6;
  }

  /* ---- ページ切り替え(協賛 / SNSリンク) ---- */
  .view{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .view[hidden]{ display:none; }

  .to-links-btn{
    position:fixed;
    top:16px;
    right:16px;
    z-index:30;
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:9px 15px;
    border-radius:999px;
    background:var(--ink);
    color:#fff;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.02em;
    border:1px solid var(--hairline);
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 8px 16px -8px rgba(20,12,2,0.5);
  }
  .to-links-btn:hover{ background:var(--surface-2); }

  .sponsor-title{
    margin:64px 0 28px;
    font-size:1.3rem;
    font-weight:700;
    letter-spacing:.15em;
    color:var(--ink);
    text-align:center;
  }
  .sponsor-wip{
    margin:0;
    max-width:300px;
    font-size:.85rem;
    font-weight:600;
    line-height:1.9;
    color:var(--ink-dim);
    text-align:center;
  }
  .sponsor-wip .wip-headline{
    display:inline-block;
    margin-bottom:6px;
    font-size:1.3rem;
    font-weight:800;
    color:var(--ink);
  }

  /* ---- SNSリンクページ下部の協賛(準備中)表示 ---- */
  .sponsor-teaser{
    margin-top:44px;
    text-align:center;
  }
  .sponsor-teaser .tagline{ margin-bottom:8px; }
  .sponsor-teaser .status{
    font-size:.78rem;
    font-weight:600;
    color:var(--ink-dim);
  }

  /* ---- 協賛(ランク分け) ---- */
  .sponsors{
    width:100%;
    max-width:320px;
    margin-top:0;
    text-align:center;
  }
  .tier{ margin-bottom:26px; }
  .tier:last-child{ margin-bottom:0; }
  .tier-label{
    margin:0 0 10px;
    font-size:.7rem;
    font-weight:800;
    letter-spacing:.14em;
    text-align:center;
  }
  .tier-premium .tier-label{ color:var(--gold-mid); font-size:.8rem; }
  .tier-official .tier-label{ color:var(--ink-dim); }
  .tier-support .tier-label{ color:var(--ink-dim); opacity:.75; font-size:.64rem; }

  .sponsor-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .sponsor-list a, .sponsor-list .sponsor-card{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:8px;
    padding:11px 16px;
    border:1px solid rgba(70,42,6,0.18);
    border-radius:10px;
    background:rgba(255,255,255,0.55);
    color:var(--ink);
    text-decoration:none;
    font-size:.86rem;
    font-weight:600;
    transition:background .15s ease, border-color .15s ease;
  }
  .sponsor-list a:hover{
    background:rgba(255,255,255,0.85);
    border-color:rgba(70,42,6,0.3);
  }
  .sponsor-list a .type{
    font-size:.68rem;
    font-weight:500;
    color:var(--ink-dim);
  }

  .sponsor-card .name{ color:var(--ink); }
  .sponsor-card.no-link{ opacity:.7; }
  .sponsor-card .links{ display:flex; gap:10px; }
  .sponsor-card .links a{
    font-size:.68rem;
    font-weight:700;
    color:var(--ink-dim);
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .sponsor-card .links a:hover{ color:var(--ink); }

  .tier-premium .sponsor-list a, .tier-premium .sponsor-list .sponsor-card{
    padding:15px 18px;
    font-size:1rem;
    font-weight:800;
    border:1.5px solid var(--gold-mid);
    background:linear-gradient(180deg, rgba(255,226,122,0.4), rgba(255,255,255,0.6));
  }
  .tier-premium .sponsor-list a:hover{ background:linear-gradient(180deg, rgba(255,226,122,0.55), rgba(255,255,255,0.75)); }

  .tier-support .sponsor-list a{
    padding:9px 14px;
    font-size:.8rem;
    font-weight:600;
    border:1px solid rgba(70,42,6,0.1);
    background:rgba(255,255,255,0.4);
    color:var(--ink-dim);
  }

  .sponsor-cta{
    display:inline-block;
    margin-top:30px;
    font-size:.76rem;
    color:var(--ink-dim);
    text-decoration:underline;
    text-underline-offset:3px;
  }

  /* ---- link grid (logo only, 2 columns) ---- */
  .link-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:15px;
    width:100%;
    max-width:272px;
  }

  .tile-wrap{
    position:relative;
    aspect-ratio:1;
  }

  /* ハンバーガーの側面シルエット(参考画像の輪郭を再現。色は使わずアウトラインのみ流用) */
  .tile{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-top:6%;
    background:linear-gradient(180deg, #fff3c9 0%, var(--gold-bright) 16%, var(--yellow) 30%, #603017 34%, #3a1c0b 52%, #4a2410 68%, var(--gold-mid) 74%, var(--gold-deep) 88%, #8a5f0f 100%);
    filter:drop-shadow(0 10px 14px rgba(40,24,4,0.5));
    clip-path:url(#burgerClip);
    text-decoration:none;
    transition:transform .15s ease, filter .15s ease;
  }
  .tile:hover{ transform:translateY(-3px); filter:drop-shadow(0 14px 18px rgba(40,24,4,0.6)); }
  .tile:active{ transform:translateY(0) scale(.96); }
  .tile:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

  /* ごま(sesame seeds): バンズ上部にランダムに散らす */
  .tile::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(ellipse 3.4px 2px at 30% 13%, rgba(64,38,8,0.55) 48%, transparent 52%),
      radial-gradient(ellipse 3.4px 2px at 50% 9%, rgba(64,38,8,0.55) 48%, transparent 52%),
      radial-gradient(ellipse 3.4px 2px at 69% 14%, rgba(64,38,8,0.55) 48%, transparent 52%),
      radial-gradient(ellipse 3px 2px at 40% 19%, rgba(64,38,8,0.45) 48%, transparent 52%),
      radial-gradient(ellipse 3px 2px at 60% 20%, rgba(64,38,8,0.45) 48%, transparent 52%);
  }

  .tile .brand-icon{ position:relative; z-index:2; width:36%; height:36%; }
  .tile .brand-icon svg{ width:100%; height:100%; display:block; }

  .tile .plain-icon{ position:relative; z-index:2; width:32%; height:32%; color:var(--cream); }
  .tile .plain-icon svg{ width:100%; height:100%; display:block; }

  .tile.placeholder{ cursor:default; opacity:.45; }
  .tile.placeholder:hover{ transform:none; filter:drop-shadow(0 10px 14px rgba(40,24,4,0.5)); }

    top:6px;
    right:2px;
    z-index:5;

    font:inherit;

  }

    grid-column:1 / -1;
    width:calc(50% - 7.5px);

  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%, 12px);
    max-width:min(340px, calc(100% - 40px));
    background:var(--ink);
    color:var(--cream);

    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:20;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; cursor:pointer; }

<!-- Google Analytics 4 (GitHub Pages 版のみ)。測定IDは build-deploy.js がビルド時に差し込む -->
<script>
(function () {
  var GA_ID = 'G-DL7FDKXQRW';
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  window.gtag = gtag;
  gtag('js', new Date());
  gtag('config', GA_ID, { send_page_view: false });

  // 測定IDが未設定(プレースホルダー)のときは外部スクリプトを読み込まない
  if (GA_ID.indexOf('XXXX') === -1) {
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(s);
  }

  // ---- ページ別アクセス数: 表示された .view ごとに仮想ページビューを送る ----
  // 新しい .view を追加しても、id が view-○○ なら自動で計測される
  var VIEW_TITLES = { sponsors: '協賛', links: 'SOCIAL LINKS' };
  var base = location.pathname.replace(/\/$/, '');
  var current = null;

  function sendPageView(el) {
    var key = el.id.replace(/^view-/, '');
    gtag('event', 'page_view', {
      page_title: VIEW_TITLES[key] || key,
      page_path: base + '/' + key,
      page_location: location.origin + base + '/' + key
    });
  }

  var views = Array.prototype.slice.call(document.querySelectorAll('.view'));
  views.forEach(function (v) {
    if (!v.hidden) { current = v; sendPageView(v); }
  });
  var observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (m) {
      var v = m.target;
      if (!v.hidden && v !== current) { current = v; sendPageView(v); }
    });
  });
  views.forEach(function (v) {
    observer.observe(v, { attributes: true, attributeFilter: ['hidden'] });
  });

  // ---- クリック数: リンク/ボタンのタップを link_name 付きで記録 ----
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('main a, main button') : null;
    if (!el) return;
    var name = (el.getAttribute('aria-label') || el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 60);
    if (!name) return;
    var card = el.closest('.sponsor-card');
    var cardName = card && card.querySelector('.name');
    if (cardName) name = cardName.textContent.trim() + ' / ' + name;
    var params = {
      link_name: name,
      view: current ? current.id.replace(/^view-/, '') : '',
      transport_type: 'beacon'
    };
    var href = el.getAttribute('href');
    if (href && href.charAt(0) !== '#') params.link_url = el.href;
    gtag('event', 'link_click', params);
  }, true);
})();
</script>
